name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yii2s_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, redis, mbstring
          coverage: none

      - name: Install Swoole (pecl)
        # Self-managed pecl install instead of setup-php's "swoole"
        # extension key: that path silently skips the extension when its
        # build fails, and composer's platform check then blows up two
        # steps later. This mirrors the verified local WSL recipe.
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libbrotli-dev libssl-dev zlib1g-dev pkg-config
          yes '' | sudo pecl install swoole
          echo "extension=swoole.so" | sudo tee /etc/php/${{ matrix.php }}/mods-available/swoole.ini
          sudo phpenmod -v ${{ matrix.php }} swoole
          php -m | grep -i swoole

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage --verbose

  static:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        # static analysis does not need the real swoole extension (swoole/ide-helper
        # provides the class definitions), only composer's platform check satisfied
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole

      - name: Run php-cs-fixer
        run: vendor/bin/php-cs-fixer check --diff
