name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yii2s_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcntl/posix are required by the multi-process Swoole\Http\Server
          # (SWOOLE_PROCESS) used by the integration tests.
          extensions: pdo_mysql, redis, mbstring, pcntl, posix
          coverage: pcov

      - name: Install Swoole (pecl)
        # Self-managed pecl install instead of setup-php's "swoole" extension
        # key: that path silently skips the extension when its build fails, and
        # composer's platform check then blows up two steps later. Pin to the
        # 6.x line so a future Swoole 7 does not silently break the matrix.
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libbrotli-dev libssl-dev zlib1g-dev pkg-config
          yes '' | sudo pecl install swoole-6.2.4
          echo "extension=swoole.so" | sudo tee /etc/php/${{ matrix.php }}/mods-available/swoole.ini
          sudo phpenmod -v ${{ matrix.php }} swoole
          php -m | grep -i swoole

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --coverage-text --verbose

  e2e:
    name: e2e process lifecycle
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yii2s_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # pcntl/posix are required by the multi-process Swoole\Http\Server
          # driven by the e2e script (start/status/reload/SIGTERM).
          extensions: pdo_mysql, redis, mbstring, pcntl, posix
          coverage: none

      - name: Install Swoole (pecl)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libbrotli-dev libssl-dev zlib1g-dev pkg-config
          yes '' | sudo pecl install swoole-6.2.4
          echo "extension=swoole.so" | sudo tee /etc/php/8.4/mods-available/swoole.ini
          sudo phpenmod -v 8.4 swoole
          php -m | grep -i swoole

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Initialise the demo database
        env:
          YII2S_TEST_DB_PASSWORD: root
        # The service container only creates yii2s_test; the example app uses
        # yii2s_demo. init-db.php is idempotent (CREATE ... IF NOT EXISTS).
        run: php example/init-db.php

      - name: Run e2e process lifecycle
        env:
          YII2S_TEST_DB_PASSWORD: root
          # pecl swoole is loaded into the system php; there is no swoole-cli.
          CLI: php
        run: bash scripts/e2e.sh

  smoke:
    name: Blog demo smoke (end-to-end)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, mbstring, pcntl, posix
          coverage: none

      - name: Install Swoole (pecl)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libbrotli-dev libssl-dev zlib1g-dev pkg-config
          yes '' | sudo pecl install swoole-6.2.4
          echo "extension=swoole.so" | sudo tee /etc/php/8.4/mods-available/swoole.ini
          sudo phpenmod -v 8.4 swoole
          php -m | grep -i swoole

      - name: Install main package
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install blog demo
        # The blog demo resolves easydowork/yii2s via a path repository symlink
        # to the checkout root, so the main package must be installed first.
        run: composer install --prefer-dist --no-interaction --no-progress
        working-directory: examples/blog

      - name: Run smoke test
        # smoke.sh boots the coroutine server and exercises every feature:
        # MVC, error page, REST API, session+CSRF, upload+static, CSV download,
        # queue worker and a concurrency burst. CLI=php overrides its default
        # swoole-cli for the CI environment.
        run: CLI=php bash scripts/smoke.sh
        working-directory: examples/blog

  static:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        # static analysis does not need the real swoole extension (swoole/ide-helper
        # provides the class definitions), only composer's platform check satisfied
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole

      - name: Run php-cs-fixer
        run: vendor/bin/php-cs-fixer check --diff
